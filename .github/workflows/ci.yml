name: Test and package

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package
        run: python -m pip install .

      - name: Run the unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile all Python sources
        run: python -m compileall -q src scripts tests

  # The version comes from ci-vars, and the packaging and documentation
  # archive are produced by the Makefile, so that the GitHub and GitLab
  # builds produce identically named artifacts from the same commit.
  # ci-vars needs the full history and tags to derive the version, hence
  # fetch-depth: 0 on the checkouts below.
  package:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install build twine

      - name: Check release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          eval "$(./ci-vars)"
          if [ "$TAG_NAME" != "v$CI_PROJECT_VERSION" ]; then
            echo "Tag $TAG_NAME does not match the ci-vars version $CI_PROJECT_VERSION." >&2
            exit 1
          fi

      - name: Build wheel, source and Debian distributions
        shell: bash
        run: |
          eval "$(./ci-vars)"
          make package VERSION="$CI_PROJECT_VERSION"
          test -n "$(find dist -maxdepth 1 -name '*.deb' -print -quit)"

      - name: Validate distribution metadata
        run: python -m twine check dist/*.tar.gz dist/*.whl

      - name: Install and smoke-test the source distribution
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sdist-test"
          "$RUNNER_TEMP/sdist-test/bin/pip" install dist/*.tar.gz
          "$RUNNER_TEMP/sdist-test/bin/python" -c 'import riscos_artworks; print(riscos_artworks.__version__)'
          "$RUNNER_TEMP/sdist-test/bin/riscos-artworks" --version
          "$RUNNER_TEMP/sdist-test/bin/riscos-artworks" dump --format json "corpus/BlackRect,d94" >/dev/null

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/*.deb
          if-no-files-found: error
          retention-days: 30

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build PRM-in-XML documentation
        uses: gerph/riscos-prminxml-action@v1
        with:
          files: docs/artworks-fileformat.xml
          output: output/docs
          style: prm

      - name: Package documentation
        id: docsversion
        shell: bash
        run: |
          eval "$(./ci-vars)"
          make docs-zip VERSION="$CI_PROJECT_VERSION"
          leafname="$(find . -maxdepth 1 -name '*-docs.zip' -printf '%f' -quit)"
          test -n "$leafname"
          echo "leafname=$leafname" >> "$GITHUB_OUTPUT"

      - name: Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation
          path: ${{ steps.docsversion.outputs.leafname }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - package
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packages
          path: dist

      - name: Download documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: documentation
          path: dist

      # The release is created as a draft with no notes: release notes are
      # written by hand (they are not a changelog or a list of merged pull
      # requests), and the release is published from the GitHub UI once
      # they are in place. The built files are attached automatically.
      - name: Create or update the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* \
              --verify-tag \
              --draft \
              --notes "" \
              --title "$TAG_NAME"
          fi
