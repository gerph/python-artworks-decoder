[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riscos-artworks"
version = "0.1.0"
description = "A structural decoder for Computer Concepts ArtWorks files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Gerph", email = "gerph@gerph.org"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools.packages.find]
where = ["src"]
